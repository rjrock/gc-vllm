[workspace]
provider = "claude"

[providers]
[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0
args_append = ["--dangerously-bypass-hook-trust"]

[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
args_append = ["--permission-mode=bypassPermissions"]

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

# [mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
# retention_ttl = "0"

[[rigs]]
name = "vllm"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"
[rigs.imports.investigation]
source = "./packs/investigation"
[rigs.imports.experimentation]
source = "./packs/experimentation"
[rigs.imports.implementation]
source = "./packs/implementation"

[[rigs]]
name = "llm-bench-runner"
prefix = "llm-bench-runner"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "aiter"
default_branch = "main"
[rigs.imports]
[rigs.imports.experimentation]
source = "./packs/experimentation"
[rigs.imports.implementation]
source = "./packs/implementation"
[rigs.imports.investigation]
source = "./packs/investigation"
