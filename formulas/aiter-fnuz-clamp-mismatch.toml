If blocked (remote host unreachable, image transfer fails, no idle remote
GPU, cannot produce a usable handoff), append the reason, set
`gc.outcome=fail` and `gc.failure_reason=<reason>`, and close only this
step. Do not close the workflow root.
"""

[steps.metadata]
