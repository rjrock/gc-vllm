[[steps]]
id = "investigate_mi350"
title = """\
Investigate whether the aiter FP8 clamp mismatch has an analogue on MI350 \
(gfx950) hardware"""
description = """
Investigate, on real MI350 (gfx950) hardware over SSH, whether the gfx942
fnuz clamp mismatch described below has an analogue here. Do not assume it
does: gfx950 typically uses the standard OCP `float8_e4m3fn` convention
rather than `float8_e4m3fnuz`, so `current_platform.is_fp8_fnuz()` may be
False on this arch, `QuantFP8.forward_hip`'s dispatch may take a different
branch than on gfx942, and even `get_fp8_min_max`'s own ±224/±240-style
bounds may differ for the non-uz dtype. Establish the actual dtype,
dispatch path, and expected/actual clamp bounds on this hardware FIRST, as
fresh evidence; only then judge whether a comparable mismatch is present,
absent, or differently shaped. This workflow requires rebuilding the
target image's installed aiter from a tip-of-tree checkout in true
editable/develop mode on the remote host before diagnosing, exactly as the
gfx942 lane does, so the aiter kernel under test is current source, not a
frozen wheel.

The gfx942 finding this lane is checking for an analogue of, as unverified
context (not an established fact on this hardware):

{{known_context}}

How aiter's editable/develop mode works, and how to put the image's aiter
into it against a tip-of-tree checkout (applies identically on the remote
host once the worktree and image are transferred there):

{{editable_mode_notes}}

Environment: use the local docker image `{{image}}`, transferred to the
remote host per the rules below (do not pull or rebuild it there).
Resolve the aiter rig's source repository and tip-of-tree commit using `gc
rig list --json` (registered path hint: {{aiter_repo_path}}; verify rather
than assume) on THIS (dispatching) host -- the rig itself lives here, not
on the remote host. The vllm fix will land in the vllm rig (host checkout
hint: {{vllm_repo_path}}, read-only here).

{{remote_gpu_rules}}

Additional focus or hints: {{question}}

Diagnose only; do not implement a fix in this step. Do the aiter
editable-mode overwrite in your own isolated worktree on this (dispatching)
host, at
`~/dev/cities/gc-worktrees/aiter/{{formula_id}}/investigate_mi350/<claimed-bead-id>`
on branch `{{formula_id}}/investigate_mi350/<claimed-bead-id>`, per your pack's
worktree protocol, then rsync it to the remote host and bind-mount the remote copy read-write into the
remote container to perform the `setup.py develop` (or `pip install -e .`)
overwrite and all testing. Confirm genuine editable mode (aiter.__file__
location, install_mode file content, absence of a used aiter_meta/ tree)
before treating any reproduction as valid.

Reproduce the smallest failing case first: on the remote host, call the
aiter per-tensor quant path directly on a tensor of this hardware's actual
fp8 dtype with values whose magnitude approaches and exceeds whatever
bound `get_fp8_min_max` reports for that dtype on gfx950, and compare
against vllm's own fp8 quant kernel (`ops.scaled_fp8_quant`) on the same
inputs. Then run `cd /root/dev/vllm && python3 -m pytest -v -s
tests/kernels/test_concat_mla_q.py -k test_concat_mla_q_fp8_nope_and_rope`
with `VLLM_ROCM_USE_AITER=1` on the remote host (against the image's own,
unedited vllm checkout) and record whether it fails, passes, or is
skipped/inapplicable on this hardware, and why.

Use `{{artifact_dir}}` as the shared directory for this run. Write your
artifacts under `{{artifact_dir}}/investigate_mi350/`, creating that
subdirectory if needed; it must not contain an earlier run's reports. Do
not overwrite existing files.

Before closing this step, write
`{{artifact_dir}}/investigate_mi350/investigation.md` with:
- Your claimed bead ID, the aiter tip-of-tree commit used, the remote host
  used, and date.
- The exact reproduction commands, container name/flags, remote GPU index,
  environment variables, versions; mark missing information.
- The exact steps used to transfer the image and overwrite the remote
  aiter with the editable tip-of-tree checkout (local worktree path/branch,
  remote scratch path, rsync command, mount flags, install command run
  inside the remote container, and the three editable-mode verification
  checks and their results).
- What this hardware's actual fp8 dtype and dispatch path are, established
  as fresh evidence, with file:line references (in the aiter worktree and
  the image's /root/dev/vllm) and raw output paths.
- Whether an analogous clamp/saturation mismatch is present, absent, or
  differently shaped on this hardware, with confidence, alternatives, and
  missing evidence. Separate fresh observations from the supplied gfx942
  context and from untested hypotheses.
- A minimal experiment plan for the experimenter: hypothesis, prediction,
  control, exact commands, distinguishing result. If the investigation
  concludes there is no bug here, say so explicitly and state what a
  confirming experiment would look like regardless.

Append the handoff summary and absolute report path to this claimed step's
notes with `gc bd update <claimed-bead-id> --append-notes <text>` and
record `--set-metadata investigation.report_path=<path>`. Verify the
report is readable, then set `gc.outcome=pass` on this claimed step and
