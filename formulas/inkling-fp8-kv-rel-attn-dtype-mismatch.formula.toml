[vars.known_context]
description = """\
What is already established from fresh code-reading in this session (NOT GPU-validated \
yet -- the crash has only been observed via the nightly log, not reproduced live), as \
evidence to build the investigation on, not a conclusion to copy blindly."""
default = '''1. The crash: every TP worker (worker TP7/EP7 shown in the captured log; by
construction of a crashing Triton COMPILATION (not a runtime data-dependent failure),
every worker with a nonzero batch hits the same compile path identically) raised
`triton.compiler.errors.CompilationError` with the underlying
`AssertionError: Both operands must be same dtype. Got bf16 and uint8` at
`triton/language/semantic.py:1441`'s `assert lhs.dtype == rhs.dtype` inside `tl.dot`,
during `determine_available_memory` -> `profile_cudagraph_memory` ->
`capture_model` -> CUDA-graph-capture's `forward_fn(CUDAGraphMode.NONE)` -- i.e.
startup-time graph-capture profiling, before any real request is served. The engine
then raised `RuntimeError: Engine core initialization failed`, aborting the whole
server.

2. Root cause (fresh grep/read this session, vllm/models/inkling/amd/ops/fa4_rel_attention.py,
`_inkling_rel_attention_kernel`, currently line ~112-289): the non-split-KV path (used
whenever `use_split_kv_decode(...)` returns False -- see point 4) loads `k` directly
from `k_ptr` with NO dtype cast or scale-aware dequant:
```
k = tl.load(k_ptr + ..., mask=..., other=0.0)
scores = tl.dot(q, k) * (softmax_scale * log2e)   # line 215, the crash site
```
`q` enters already cast to the model's bf16 compute dtype (loaded via
`tl.load(q_block_ptr, ...)`, no cast either, so it stays whatever dtype `q_ptr`
actually is -- confirm this is genuinely bf16 for Inkling-FP8-dynamic specifically,
not assumed). With `--kv-cache-dtype=fp8`, `kv_cache_dtype_str_to_dtype` maps the
string `"fp8"` to `torch.uint8` STORAGE dtype (vllm/utils/torch_utils.py:43-44;
`InklingAttention.kv_cache_torch_dtype` in attention.py:166-168 derives this the same
way other FlashAttentionBackend-based layers do). So `k_ptr` points at `uint8`-typed
memory and `tl.dot(q, k)` mixes bf16 and uint8 operands, tripping Triton's dtype-match
assertion at compile time (not even execution time -- this is a `tl.jit` AST->IR
compile failure, so it is 100% deterministic given these shapes/dtypes, not a rare
runtime corner case).

3. A SIBLING kernel in the SAME model handles this correctly already:
`_split_kv_stage1` in vllm/models/inkling/amd/ops/rel_attention_decode.py (currently
line ~165) does `scores = tl.dot(q, k.to(q.dtype)) * softmax_scale` -- an explicit
`.to(q.dtype)` cast immediately before the dot. This is the ROCm decode-split path used
when `use_split_kv_decode(max_query_len=1, ...)` is True (rel_attention_decode.py:48-64:
requires `max_query_len == 1` AND `page_size >= 64` in the common case). Confirm from
scratch which of the two kernels CUDA-graph-capture profiling actually exercises for
each captured shape (it likely profiles BOTH a decode-shape (max_query_len==1) and a
larger graph-capture shape; a captured `max_query_len > 1` or sliding-window/small-page
shape would route to `_inkling_rel_attention_kernel`, the crashing one, even if
single-token decode at serve time would have used the already-safe split-KV path) --
do not assume the crash is specific to one scheduling regime without checking.

4. A plain `.to(q.dtype)` cast is a VALUE-PRESERVING numeric conversion, not a
byte-reinterpretation (contrast with the separate, unrelated fn/fnuz
byte-reinterpretation bug class investigated elsewhere in this project,
[[glm5next-decode-qk-fnuz-reinterp]] -- that bug involved feeding a tensor into a
kernel with a MISMATCHED fixed pointer-type signature, which byte-reinterprets without
converting; this Inkling case is different, `tl.dot` itself is refusing to proceed, and
a `.to(dtype)` cast on a `torch.uint8`-viewed fp8 tensor is exactly the
reinterpret-as-fp8-then-convert-to-float pattern Triton's own fp8 support expects --
e.g. `tl.load(...).to(tl.float8e4) ... .to(tl.bfloat16)` style idioms used elsewhere in
vllm's Triton kernels, see `triton_unified_attention.py`'s `_cast_kv_tile` helper for a
MORE complete reference implementation of this same general problem, including a
per-tensor DEQUANT scale multiply, not just a raw dtype cast).

5. HOWEVER, a critical open question this session did NOT resolve: does a correct fix
need to be SCALE-AWARE (i.e. `k.to(tl.float8e4...).to(tl.bfloat16) * k_scale`, not just
a raw `.to(q.dtype)`)? Evidence both ways:
   a. `InklingAttention` registers `k_scale`/`v_scale` buffers
      (vllm/models/inkling/amd/attention.py:169-170) as constant `1.0` tensors, and a
      fresh grep this session found NO call site anywhere in
      vllm/models/inkling/amd/{attention.py,ops/fa4_rel_attention.py,ops/rel_attention_decode.py}
      that reads `self.k_scale`/`self.v_scale`/`layer._k_scale`/`layer._v_scale` --
      i.e. if a nonunity scale were ever calibrated, this model's attention call path
      has NO wiring to apply it at all, in EITHER kernel (split or non-split). Compare
      this to `vllm/v1/attention/backends/triton_attn.py`, which DOES wire
      `layer._k_scale`/`layer._v_scale` into a `k_descale`/`v_descale` argument passed
      into its unified kernel.
   b. The ALREADY-WORKING sibling kernel (`_split_kv_stage1`,
      point 3 above) does a bare `.to(q.dtype)` with NO scale multiply either -- so if
      that kernel is genuinely exercised today with `--kv-cache-dtype=fp8` on some
      other Inkling config/shape and is known-correct (or at least not known-broken),
      that is evidence the existing design intentionally uses a fixed/unity implicit
      scale for this model's fp8 KV cache, making a bare `.to(q.dtype)` cast
      structurally consistent with the sibling path, not a parallel bug.
   c. It is NOT yet established which of (a) or (b) is the right read: maybe the
      split-KV kernel's own `.to(q.dtype)` is ALSO silently wrong whenever a
      non-unity scale is calibrated (i.e. this would be a second latent bug, not
      evidence of a safe pattern) -- the investigation must determine whether
      `k_scale`/`v_scale` are EVER calibrated to something other than 1.0 for this
      model/quantization combo (e.g. does the checkpoint's quantization config or
      vLLM's FP8 KV-cache calibration path set them, even if the attention module
      never reads them -- if so, that is itself a separate, likely more severe silent
      correctness bug: scales computed but silently dropped).

6. CORRECTED (fresh evidence, 2026-10-23): an earlier draft of this context claimed
gfx950/MI350 is NOT affected because `use_gfx950_gluon_decode`/
`use_gfx950_gluon_extend` (fa4_rel_attention.py:31-61) route gfx950 through entirely
different vendored Gluon kernels before ever reaching `_inkling_rel_attention_kernel`.
This is WRONG: the crash recurred verbatim on node f22, which is confirmed 100%
gfx950/MI350X (`ssh f22 rocm-smi --showproductname`), on 2026-10-23
(cron/nodes/f22/logs/inkling-fp8-dynamic/2026-10-23/nightly/server.log), with the
identical `Both operands must be same dtype. Got bf16 and uint8` error at the same
`fa4_rel_attention.py:104`-ish `tl.dot(q, k)` site. Reading the two gfx950 gates
side-by-side explains why: `use_gfx950_gluon_decode` requires `max_query_len == 1`,
and `use_gfx950_gluon_extend` requires `max_query_len > 1` AND `max_kv_len >= 8192`
AND `window_left < 0`. There is a GAP between them: any call with
`max_query_len > 1` (e.g. produced by this recipe's MTP speculative decoding,
`num_speculative_tokens=8`) and `max_kv_len < 8192` (true at CUDA-graph-capture
startup profiling, and plausibly in some live-traffic shapes too) satisfies NEITHER
gate and falls through to the same unguarded generic `_inkling_rel_attention_kernel`
that gfx942 would also hit. So this bug reproduces on gfx950 (confirmed) via this
gate-gap, not via gfx950 being universally unaffected. A prior investigation session
(bead vl-mza6/vl-df9x, report at
`/home/ryrock/dev/cities/runs/inkling-c13/investigate/investigation.md`) validated a
two-part fix (a `.view(fp8_dtype)` reinterpret-cast at the `InklingAttention` call
site plus a `.to(q.dtype)` cast inside the kernel) ONLY on a gfx942/MI300X host
(s79), never on gfx950 -- re-validate that fix (or find a different one) on actual
gfx950 hardware per {{node}}, since the Gluon-kernel gating difference may mean
gfx950 needs additional or different handling (e.g. does the gate-gap shape also
flow through the gfx950 Gluon kernels' own fp8 handling in some configurations,
and do the Gluon kernels accept but silently ignore `k_scale`/`v_scale` the same
way, per the investigation's open question about `gluon_rel_mha_decode_gfx950`/
`gluon_rel_mha_extend_gfx950`). Confirm precisely which gate (or gap) is reached
for each captured shape, do not assume it is the same analysis as the gfx942 case
without checking on gfx950 hardware directly.

7. Not yet established, and explicitly left to the investigation: (a) is `k_scale`/
`v_scale` genuinely unused/dead weight for this model class, or is there an AMD-side
quantization/calibration hook elsewhere in the model (e.g. MoE or qkvr_prep) that
feeds a real scale into the KV cache write path that this reasoning missed; (b) what
exact shapes (BLOCK_Q/BLOCK_K/page_size/batch) CUDA-graph warmup captures for this
model/TP configuration, to build a minimal, faithful repro; (c) whether
`--kv-cache-dtype=fp8` was a NEW flag recently added to this nightly recipe (i.e. a
regression) vs. a long-standing untested combination for Inkling -- check this
project's own recipe git history (cron/nodes/*/logs or the recipe config under
cron/recipes, if still present after the recent `cron/recipes -> cron/nodes` move) for
when `--kv-cache-dtype=fp8` was introduced for Inkling-FP8-dynamic, if at all
determinable from history.'''

[vars.gpu_rules]
description = "Rules for using {{node}}'s GPUs safely. No fallback host -- {{node}} is required."
default = '''GPU RULES (resolve <NODE> and <IMAGE> below to the concrete NODE/IMAGE
values stated directly above where this block is included -- do not treat these
angle-bracket names as literal hostnames/images. <NODE> is expected to have 8 gfx950
(MI350X or MI355X) GPUs, shared with other users -- re-verify this count/architecture
on <NODE> itself rather than assuming it).
1. Confirm `<NODE>` is reachable (`ssh <NODE> true`) and is gfx950 (MI350X or
   MI355X) (`ssh <NODE> rocm-smi --showproductname`) before using it. This bug is
   REQUIRED to be reproduced and validated on gfx950 hardware -- it is confirmed
   (live nightly recurrence, 2026-10-23) to reproduce there; do not substitute a
   gfx942/MI300X node even temporarily, and there is no fallback host for this
   workflow. If `<NODE>` is unreachable or not gfx950, record that as a blocker
   rather than switching architecture. Use ONE GPU per container. Before every
   launch run `ssh <NODE> rocm-smi --showuse` and `ssh <NODE> rocm-smi
   --showmeminfo vram`; pick a GPU with 0% use and ~no VRAM held. Never use a busy
   GPU. Record the index (and node) in your report. If every GPU on `<NODE>` is
   busy, record that as a blocker rather than waiting or using a busy GPU.
   Note: this bug is a hard Triton COMPILE-time failure reachable with a single
   GPU and a tiny synthetic input -- you do not need all 8 GPUs or true TP=8 to
   reproduce it; only use more than one GPU if a single-GPU repro genuinely
   cannot reach the crashing code path (e.g. if the kernel is only ever invoked
   under enable_expert_parallel + TP>1 scheduling, confirm this before assuming
   it).
2. Run containers (via `ssh <NODE> docker ...`) with `--device=/dev/kfd
   --device=/dev/dri --group-add video --security-opt seccomp=unconfined
   --ipc=host --shm-size=16g` and `-e HIP_VISIBLE_DEVICES=<idx>`, name them with
   your claimed bead ID, use `--entrypoint bash` (the image entrypoint is not a
   shell), and `docker rm -f` them when done, on every error path (including via
   `ssh <NODE> docker rm -f ...`).
3. Triton JIT-compiles kernels on first use and can take minutes; allow for it.
4. Do not modify the image. Do not run `docker commit` over `<IMAGE>`. When
   validating a vllm-side fix, bind-mount your vllm worktree's python sources
   (synced to `<NODE>`, e.g. via `rsync -a --delete`) read-only over
   /root/dev/vllm (or wherever `vllm.__file__` resolves inside the image --
   confirm the actual site-packages path first) inside the container, and
   confirm `vllm.__file__` points at your mounted sources before trusting any
   test result.
5. Disk: check `df -h` on `<NODE>` before large builds; layout/capacity may
   differ from any other host.'''

