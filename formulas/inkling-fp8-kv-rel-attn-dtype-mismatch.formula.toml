count). If the investigation found CUDA-graph-capture profiling also reaches the
sibling split-KV kernel for some shapes in this config, confirm the fix (or the
decision not to touch it) is consistent across both.

Save experiment records and raw output under `{{artifact_dir}}/experiment/` (creating
