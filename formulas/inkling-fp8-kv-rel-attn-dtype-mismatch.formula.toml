title = """\
Validate candidate fix shapes for the crashing kernel against a real GPU, confirming \
numerical correctness (not just that compilation succeeds)"""
needs = ["investigate"]
description = """
Read `{{artifact_dir}}/investigate/investigation.md` before running anything. Read the
producer bead ID recorded in it, and verify it belongs to the same `gc.root_bead_id` as
your claimed step and has `gc.outcome=pass`. Test environment: docker image
`{{image}}` on `{{node}}`.

NODE={{node}} IMAGE={{image}} -- resolve every `<NODE>`/`<IMAGE>` placeholder in the
rules below to these values.

{{gpu_rules}}

Additional focus or hints: {{question}}

Use a worktree at
`~/dev/cities/gc-worktrees/vllm/{{formula_id}}/experiment/<claimed-bead-id>` on branch
`{{formula_id}}/experiment/<claimed-bead-id>`, per your pack's worktree protocol.

Test the handoff's hypotheses and candidate fix shape(s); do not assume its
conclusions are correct, including which fix shape it recommended. Follow your
six-step protocol for every experiment: hypothesis, prediction (recorded before
running), exact command/environment, run, actual result, verdict (supports /
contradicts / inconclusive).

Depending on what the investigation determined about k_scale/v_scale:
- If the investigation concluded a real, nonunity scale is genuinely never computed
  for this model (unity is structurally correct), implement and test the bare
  `k.to(q.dtype)` candidate (mirroring the sibling `_split_kv_stage1` kernel exactly)
  in an isolated experiment worktree. Confirm it (a) compiles without the
  AssertionError, (b) produces attention output numerically matching a pure-fp32
  reference computed outside any kernel (construct this the way
  `tests/models/inkling/rocm/test_rel_attention.py`'s existing `_reference` helper
  does, extended to cover an fp8/uint8-dtyped K/V cache case), with rtol/atol you
  justify given fp8's precision, and (c) matches the already-working
  `_split_kv_stage1` kernel's output on an input small enough to exercise both
  kernels with IDENTICAL underlying data (same positions/shapes small enough that
  both `use_split_kv_decode` and the non-split path could plausibly run), to confirm
  consistency between the two kernels, not just internal self-consistency of the one
  you are fixing.
- If the investigation concluded a real scale exists and must be wired in, implement
  the scale-aware dequant candidate, test the same three criteria above, AND confirm
  whether the sibling `_split_kv_stage1` kernel also needs the same scale wired in (if
  it currently silently assumes unity too) -- do not fix only the crashing kernel if
  the investigation found the same gap in both.
- If the investigation's evidence is genuinely ambiguous between the two, test BOTH
  candidates against the fp32 reference and report which wins, rather than guessing.

Confirm whichever candidate wins does not regress
`tests/models/inkling/rocm/test_rel_attention.py`,
`tests/models/inkling/test_fa4_rel_attention.py`, and
`tests/models/inkling/test_qkvr_prep.py` (read each file's current pass count fresh on
