formula = "inkling-fp8-kv-rel-attn-dtype-mismatch"
version = 1
description = """\
Investigate -> experiment -> implement a fix for a Triton compilation failure in \
Inkling's ROCm relative-bias paged-attention kernel when `--kv-cache-dtype=fp8` is \
used. A nightly serving run of Inkling-FP8-dynamic on node f22, an MI350X (gfx950) \
node, launched with `--kv-cache-dtype=fp8 --enable-expert-parallel \
--speculative-config={"method":"mtp","num_speculative_tokens":8}` against \
`vllm/vllm-openai-rocm:nightly`, crashed every TP worker during engine startup \
(CUDA-graph-capture profiling, not real traffic), recurring verbatim on 2026-10-23 \
(cron/nodes/f22/logs/inkling-fp8-dynamic/2026-10-23/nightly/server.log) after an \
earlier 2026-10-21 occurrence, with \
`triton.compiler.errors.CompilationError: ... AssertionError: Both operands must be \
same dtype. Got bf16 and uint8` at `_inkling_rel_attention_kernel`'s \
`scores = tl.dot(q, k) * (softmax_scale * log2e)` line \
(vllm/models/inkling/amd/ops/fa4_rel_attention.py, currently line 215). Fresh code \
reading (this session, against the exact vllm commit the image was reportedly built \
from, b272cff368b3a0c733859ab308f7123291cf1489, re-verify this is still accurate) \
confirms the kernel's `k = tl.load(k_ptr + ...)` has no dtype cast or dequant applied \
before `tl.dot(q, k)`, so when the KV cache is fp8 (`kv_cache_dtype_str_to_dtype` maps \
`\"fp8\"` to `torch.uint8` storage, vllm/utils/torch_utils.py:43-44) and Q is `bf16`, \
Triton's `tl.dot` dtype-match assertion fails outright -- this is a hard compile-time \
failure, not a silent correctness bug, so every single worker hits it and the engine \
never starts. A SIBLING code path in the same file, \
`inkling_rel_attention_split_kv_decode`'s `_split_kv_stage1` kernel \
(vllm/models/inkling/amd/ops/rel_attention_decode.py, currently line 165: \
`scores = tl.dot(q, k.to(q.dtype)) * softmax_scale`), already casts `k` to `q`'s dtype \
before the dot -- strongly suggesting the intended fix shape for the crashing kernel is \
the same local per-call cast, NOT a cache-wide dtype change. This workflow determines \
whether a plain `.to(q.dtype)` cast is numerically correct for a genuinely fp8-quantized \
K (vs. requiring a scale-aware dequant, given fp8 KV cache storage is typically paired \
with a `k_scale`/`v_scale`, and this model's `InklingAttention.k_scale`/`v_scale` \
buffers -- registered as constant `1.0`, vllm/models/inkling/amd/attention.py:169-170 -- \
are read nowhere by the attention call path per a fresh grep this session, meaning no \
quantization scale currently reaches either kernel at all), then implements and \
validates whichever shape is correct."""

