Inkling and should instead raise a clear, early, user-facing error rather than a
confusing Triton stack trace -- consider recommending THIS as an alternative "fix" if
the experiments found fp8 KV cache is not actually meant to be supported here yet),
write the report documenting that conclusion and the evidence for it, set
`gc.outcome=pass`, and close only your step -- do not proceed with the remaining
implementation instructions below unless the experiments recommend a specific code
fix.

