[[steps]]
id = "investigate"
title = """\
Reproduce the Triton compile-time dtype-mismatch crash and determine the correct, \
scale-aware or scale-free fix shape for the K operand"""
needs = []
description = """
Re-verify, from scratch, the crash a nightly serving run hit on node f22 (gfx950/
MI350X), first on 2026-10-21 and recurring verbatim on 2026-10-23
(cron/nodes/f22/logs/inkling-fp8-dynamic/2026-10-23/nightly/server.log) -- reproduce
and validate on `{{node}}`, which MUST be gfx950 (MI350X or MI355X; confirm per
{{gpu_rules}} before trusting any result -- this bug is confirmed to reproduce on
gfx950 hardware, do not substitute a gfx942/MI300X node): every TP worker failed
Triton compilation of
`vllm.models.inkling.amd.ops.fa4_rel_attention._inkling_rel_attention_kernel` with
`AssertionError: Both operands must be same dtype. Got bf16 and uint8` at
`tl.dot(q, k)`, during CUDA-graph-capture profiling at startup (not live traffic),
aborting the whole engine. This is a 100%-deterministic Triton AST-compile failure
given the shapes/dtypes involved, not a flaky or data-dependent crash.

Context, as fresh (not yet GPU-validated) code-reading from this session to confirm or
correct, not to trust blindly:

{{known_context}}

