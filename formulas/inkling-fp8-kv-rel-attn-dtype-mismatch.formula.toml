...`), using docker image `{{image}}` there (verify presence with `ssh {{node}}
docker image inspect {{image}}`; do not pull if absent -- record as a blocker
instead; confirm it still contains the crashing kernel source at
`vllm/models/inkling/amd/ops/fa4_rel_attention.py` by reading the file inside the
container, since it may have changed since this formula was authored). The original
failing run instead pinned `{{failing_image_digest}}`, which was NOT present on
`{{node}}` at authoring time -- re-check; use {{image}} if still absent, and note the
discrepancy if {{image}}'s vllm commit differs materially from the failing run's.
Resolve the vllm rig's source repository and tip-of-tree commit using `gc rig list
--json` (registered path hint: {{vllm_repo_path}}; do not assume this hint is
accurate without verifying it against the rig registration).

NODE={{node}} IMAGE={{image}} -- resolve every `<NODE>`/`<IMAGE>` placeholder in the
rules below to these values.

{{gpu_rules}}

Additional focus or hints: {{question}}

Diagnose only; do not implement a fix in this step. If reproduction needs source
changes (e.g. a minimal synthetic harness), use a worktree at
`~/dev/cities/gc-worktrees/vllm/{{formula_id}}/investigate/<claimed-bead-id>` on branch
`{{formula_id}}/investigate/<claimed-bead-id>`, per your pack's worktree protocol.
Concretely:

- Build the smallest faithful repro: either (a) a real `vllm serve` launch against
  `{{model_path}}` with a flag-reduced version of {{failing_launch_command}} (confirm
  the model path exists on whatever host/GPU you use; if it does not, do not
  substitute an unrelated model -- fall back to (b)), or (b) a minimal synthetic
  harness calling `inkling_fa4_rel_attention` directly with a `torch.uint8`-dtyped
  paged KV cache and a `bf16` Q tensor of realistic shapes, mirroring
  `tests/models/inkling/rocm/test_rel_attention.py`'s existing test structure (read it
  in full first) but adding an fp8/uint8 KV cache case it does not currently cover
  (confirm this gap by reading the whole file, not by assuming based on a grep).
  Prefer (b) if (a) is blocked by missing weights or excessive runtime; state which you
  used and why.
- Confirm the crash reproduces on the current vllm tip-of-tree commit (file:line
  references may have shifted since the captured log) before proposing a fix.
- Determine exactly which code path(s) CUDA-graph-capture profiling exercises for this
  model/TP/speculative-decoding configuration: does it reach ONLY
  `_inkling_rel_attention_kernel` (the crashing one), or also
  `_split_kv_stage1`/`inkling_rel_attention_split_kv_decode` (the sibling kernel that
  already casts `k.to(q.dtype)`) for other captured shapes? Use `use_split_kv_decode`'s
  and `use_gfx950_gluon_decode`/`use_gfx950_gluon_extend`'s actual gating conditions
  (max_query_len, page_size, window_left, on_gfx950()) against the real captured
  shapes, not assumptions.
- Resolve the point-5 open question in {{known_context}}: is `InklingAttention.k_scale`/
  `v_scale` (registered as constant 1.0, vllm/models/inkling/amd/attention.py:169-170)
  genuinely read nowhere in the attention forward/kernel call path for BOTH the
  split-KV and non-split-KV kernels (re-grep from scratch; the prior grep was scoped to
  three specific files and may have missed an indirect call site elsewhere in the
  model, e.g. in moe.py, mtp.py, or the quantization config loader)? Is there ANY
  mechanism elsewhere (checkpoint config, `QuantizationConfig`, a calibration script)
  that computes a non-unity scale for this model's fp8 KV cache that is silently
  dropped by never reaching either kernel? If a real, non-unity scale IS computed
  somewhere and dropped, that is a second, more severe finding to report distinctly
  from the compile crash -- do not conflate the two.
- Given the above, determine the correct fix shape for the crashing kernel: a bare
  `k.to(q.dtype)` cast mirroring the sibling `_split_kv_stage1` kernel exactly (correct
  IF scale is genuinely always unity/unused for this model), vs. a scale-aware dequant
  (`(k.to(tl.float32) * k_scale).to(q.dtype)`-style, correct IF a real scale exists and
  must be wired in) -- and if the latter, identify every additional call-site change
  needed to actually thread a real `k_scale`/`v_scale` value into the kernel (both the
  crashing kernel AND, if it has the same latent gap per point 5c, the sibling
  split-KV kernel).
- Check the `q.dtype` assumption itself: trace what `q_ptr`'s actual dtype is for
  Inkling-FP8-dynamic specifically (e.g. does `--kv-cache-dtype=fp8` or any other flag
  used in {{failing_launch_command}} affect Q's dtype, or is Q always the model's
  bf16/fp16 compute dtype regardless of KV cache dtype)?
- Determine whether `--kv-cache-dtype=fp8` is a recently-introduced flag for this
  recipe (a regression) or a long-untested combination, if determinable from this
  project's own git history (cron/nodes/*/logs, or cron/recipes if any trace of the
  pre-move layout remains reachable via `git log --follow`).

Use `{{artifact_dir}}` as the shared directory for this run. Write your artifacts
under `{{artifact_dir}}/investigate/`, creating that subdirectory if needed; it must
not contain an earlier run's reports. Do not overwrite existing files.

Before closing this step, write `{{artifact_dir}}/investigate/investigation.md` with:
- Your claimed bead ID, the vllm commit used, image used, and date.
- The exact reproduction/tracing commands, container name/flags, GPU index,
  environment variables, versions; mark missing information.
- Fresh findings with file:line references and raw output paths. Separate fresh
  observations from the supplied context and from untested hypotheses.
- A definitive answer, with evidence, to: does the crash reproduce on current
  tip-of-tree? Which code path(s) does CUDA-graph-capture profiling exercise for this
  config? Is a real, nonunity k_scale/v_scale ever computed and silently dropped for
  this model, or is unity genuinely correct? Which fix shape is right for the crashing
  kernel -- bare dtype cast, or scale-aware dequant requiring additional wiring?
- Ranked root-cause hypotheses with confidence, alternatives, and missing evidence.
- A minimal experiment plan for the experimenter: hypothesis, prediction, control,
  exact commands, distinguishing result.

Append the handoff summary and absolute report path to this claimed step's notes with
`gc bd update <claimed-bead-id> --append-notes <text>` and record
`--set-metadata investigation.report_path=<path>`. Verify the report is readable, then
set `gc.outcome=pass` on this claimed step and close only it.

If blocked (image missing, no idle GPU, cannot produce a usable handoff), append the
reason, set `gc.outcome=fail` and `gc.failure_reason=<reason>`, and close only this
step. Do not close the workflow root.
"""

[steps.metadata]
"gc.run_target" = "vllm/investigation.investigator"
"gc.scope_ref" = "body"
"gc.scope_role" = "member"
"gc.on_fail" = "abort_scope"

