[[steps]]
id = "investigate"
title = "Investigate why Flint cannot be served on ROCm and whether a vLLM-generic attention fallback is viable"
needs = []
metadata = { "gc.run_target" = "vllm/investigation.investigator", "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description = """
Investigate the hypothesis: Flint (vllm/models/flint/model.py) can be made servable on
ROCm/gfx942 by making `FlintAttention.__init__`'s unconditional FlashInfer
import/assertion conditional, falling back to vLLM's already-functional, backend-
agnostic `unified_attention_with_output` path (the same path this file already uses for
every token except small pure-decode batches, and the only path ever actually reachable
on ROCm today, since `self.flint_decode` is already always False there) -- without
touching Flint's CUDA/SM100 fast paths at all.

