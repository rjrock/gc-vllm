formula = "aiter-biased-grouped-topk-nan-clamp"
version = 1
description = """\
Investigate -> experiment -> implement a fix for aiter's `biased_grouped_topk` HIP kernel \
(csrc/kernels/topk_softmax_kernels_group.cu) propagating NaN/Inf gating logits into \
non-finite topk_weights on MI300 (gfx942), reached via vLLM's fused_topk_bias() dispatch \
when VLLM_ROCM_USE_AITER=1 and scoring_func=sigmoid. Surfaced by Buildkite build \
https://buildkite.com/vllm/amd-ci/builds/14875 (job \
01a14a99-0b5d-4012-b983-7e995c59f148, 'mi300_1: (MI300) MoE Kernels Shard 1', a \
scheduled weekly 'AITER ON Full CI Run'), where \
tests/kernels/moe/test_fused_topk.py::test_fused_topk_bias_nan_inf_clamp[...-sigmoid-...] \
fails with non-finite topk_weights. Fetch the build/job via the Buildkite API using your \
own credentials if you need to re-confirm log details; do not hardcode any token in this \
formula or its artifacts."""

