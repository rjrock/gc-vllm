- Ranked root-cause hypotheses with confidence, alternatives, and missing
  evidence -- specifically, whether a single fix (e.g. extending the
  line-~1120-style clamp to all three kernels, to both `gating` and
  `sig_scores`/`sig_vec`, and to `isinf` as well as `isnan`) is sufficient, or
  whether different kernels need different treatment.
- Your finding on the softmax+bias cluster's relationship (or lack thereof) to
  this kernel bug, per the scope note in {{constraints}}.
- A minimal experiment plan for the experimenter: hypothesis, prediction,
  control, exact commands, distinguishing result.
- Explicit confirmation of what is and is not in scope per {{constraints}}.

Append the handoff summary and absolute report path to this claimed step's
notes with `gc bd update <claimed-bead-id> --append-notes <text>` and record
`--set-metadata investigation.report_path=<path>`. Verify the report is
readable, then set `gc.outcome=pass` on this claimed step and close only it.

If blocked (image missing, no idle GPU, cannot produce a usable handoff),
append the reason, set `gc.outcome=fail` and `gc.failure_reason=<reason>`, and
close only this step. Do not close the workflow root.
"""

