[vars.constraints]
description = "Optional implementation focus, validation requirements, and resource limits."
default = '''Scope this fix to aiter's biased_grouped_topk HIP kernel (the sigmoid+bias
dispatch path exercised by test_fused_topk_bias_nan_inf_clamp[...-sigmoid-...]). A
SEPARATE, already-tracked bug (formula aiter-topk_sigmoid-pybind, a JIT-binding
SyntaxError in aiter's unrelated topk_sigmoid/moe_topk_ck op) fully explains every
test_fused_topk_nan_inf_clamp[...-sigmoid-...] (non-bias) failure in the same Buildkite
job -- do not re-investigate or re-fix that cluster here; it is out of scope.
A third, DISTINCT cluster also appears in the same job:
test_fused_topk_bias_nan_inf_clamp[...-softmax-...] failures. Read
vllm/model_executor/layers/fused_moe/router/fused_topk_bias_router.py's fused_topk_bias()
and confirm: for scoring_func="softmax", there is no AITER-specific dispatch branch at
all (only "sigmoid" and "sqrtsoftplus" get aiter-specific handling when
rocm_aiter_ops.is_fused_moe_enabled()), so these cases fall through to the final plain
torch implementation (gating_output.softmax(dim=-1) -> optional bias add ->
torch.topk -> gather -> optional renormalize) regardless of VLLM_ROCM_USE_AITER, and
that implementation has zero NaN/Inf clamping. If the investigation confirms this
reproduces identically with VLLM_ROCM_USE_AITER=0, it is a vLLM-side bug, not an aiter
one -- note it clearly as a distinct, out-of-scope finding for a separate follow-up
rather than folding a fix for it into this workflow, unless it turns out to share a root
cause with the in-scope aiter kernel gap (verify, don't assume either way).'''

[vars.known_context]
description = "What is already known about this failure, as unverified context to confirm, not an established fact."
default = '''Source: Buildkite build https://buildkite.com/vllm/amd-ci/builds/14875
(job 01a14a99-0b5d-4012-b983-7e995c59f148, 'mi300_1: (MI300) MoE Kernels Shard 1'). The
build's metadata shows message "AITER ON Full CI Run - weekly", source "schedule" -- a
special scheduled run that force-enables AITER globally via a build-level Buildkite env
var (`"env": {"VLLM_ROCM_USE_AITER": "1", "NIGHTLY": "1"}`), applied to every job/command
in the build because this job runs under the native-kubernetes CI runtime
(.buildkite/scripts/hardware_ci/run-amd-test.sh's is_native_runtime() branch, which runs
test commands directly via bash in the pod rather than through `docker run -e` passthrough,
so build-level env flows straight through). VLLM_ROCM_USE_AITER defaults to False
(vllm/envs.py) and is not force-enabled in ordinary per-PR CI, which is suspected to be
why this gap has not surfaced before.

Dispatch chain, read from source (not yet empirically re-confirmed inside {{image}} this
run -- verify against whatever commit the image/rigs actually carry):
- vllm/model_executor/layers/fused_moe/router/fused_topk_bias_router.py: fused_topk_bias()
  with rocm_aiter_ops.is_fused_moe_enabled() and scoring_func == "sigmoid" calls
  rocm_aiter_ops.biased_grouped_topk(...) (gated by _aiter_can_use_biased_grouped_topk,
  which checks topk >= num_expert_group and num_expert_group in {1,2,4,8}) -- this is a
  DIFFERENT aiter entry point from topk_sigmoid (unaffected by the separately-tracked
  pybind SyntaxError bug; biased_grouped_topk is bound via the MOE_OP_PYBIND macro in
  csrc/include/rocm_ops.hpp, which correctly uses torch.Tensor-compatible pybind).
- aiter/ops/topk.py's biased_grouped_topk() Python wrapper dispatches (for MI300/gfx942,
  no AITER_FLYDSL_USE_HERD, not gfx1250) to biased_grouped_topk_hip, JIT-compiled via
  @compile_ops("module_moe_asm", fc_name="biased_grouped_topk", develop=True), backed by
  the C++ biased_grouped_topk() host function in
  aiter/csrc/kernels/topk_softmax_kernels_group.cu (near its end, ~line 1723), which
  dispatches through the LAUNCH_KERNEL() macro chain (LAUNCHER_TOPK_REG -> LAUNCHER2 ->
  LAUNCHER3 -> LAUNCHER4) to one of three __global__ kernels: topk_reg_kernel (register-
  resident fast path, ~line 744), grouped_topk_kernel (general/LDS path, ~line 444, used
  when NUM_GRP==1 i.e. num_expert_group==1), or grouped_topk_opt_sort_kernel (~line 1034,
  used only when use_opt_sort is true, which host-side biased_grouped_topk() hardcodes to
  require topk==8, num_expert_group==8, num_experts==256 -- never true for this test's
  shapes).
- The register-resident topk_reg_kernel's LAUNCHER_TOPK_REG() gate requires
  num_experts % 64 == 0 (among other conditions); the failing test's num_experts values
  are 6, 8, 16 -- none divisible by 64 -- so topk_reg_kernel is suspected to never be
  selected for these shapes, falling through to grouped_topk_kernel (general/LDS path)
  for NUM_GRP==1, or possibly the opt_sort kernel's sibling non-opt path for NUM_GRP>1 --
  the exact selected kernel per failing [num_experts, topk] combination is NOT yet
  empirically confirmed and should be verified directly (e.g. via printf debugging or
  reading the actual NUM_GRP value _aiter_get_num_expert_group(num_experts) picks for
  each failing shape), not assumed from this static analysis alone.
- NaN/Inf handling found so far by grep across
  aiter/csrc/kernels/topk_softmax_kernels_group.cu: exactly ONE line (~1120), inside
  grouped_topk_kernel's biased+non-softmax (sigmoid) score-computation block:
  `gating[i] = ::isnan(gating[i]) ? -INFINITY : gating[i];` -- applied only to the
  bias-shifted `gating` array, NOT to `sig_scores`/`sig_vec` (the pre-bias sigmoid value
  used later as the output weight when a group wins), and it does not call `::isinf()`
  at all, so a +inf input logit passes through unclamped. topk_reg_kernel (~line 744-1026)
  and grouped_topk_opt_sort_kernel (~line 1034-1512) appear to have NO NaN/Inf handling
  whatsoever (confirmed by grep for isnan/isinf across their line ranges, matches: none).
  aiter/csrc/kernels/topk_softmax_kernels.cu (a separate, non-"_group" file backing
  aiter's plain topk_softmax/moeSoftmax/moeTopK, NOT grouped_topk/biased_grouped_topk)
  also has zero isnan/isinf handling anywhere, confirmed by grep.
- Contrast: vLLM's own native csrc/moe/topk_softmax_kernels.cu has an explicit,
  unconditional NaN/Inf-to-0 clamp applied to both its moeSoftmax/moeSigmoid device
  functions (~lines 136, 159: `if (isnan(x) || isinf(x)) x = 0.f;`) and its vectorized
  topkGating kernel (~lines 466-474, comment: "Fix: clamp NaN/Inf values to 0 to prevent
  duplicate expert IDs... With 0s, the argmax uses index tie-breaking to pick
  [0,1,2,...,k-1]."). This is the convention the regression tests
  (test_fused_topk_nan_inf_clamp / test_fused_topk_bias_nan_inf_clamp in
  tests/kernels/moe/test_fused_topk.py, added as "Regression test for the NaN/Inf clamp
  in topk_softmax_kernels.cu") were written to protect for vLLM's OWN kernels -- the
  protection does not extend to aiter's kernels, which are a different, independently
  maintained implementation.
- Exact observed failures from the build 14875 log (dtype x bad_value x scoring_func x
  topk x num_experts), sigmoid+bias cluster only (softmax+bias cluster is the separate,
  possibly-out-of-scope item described in {{constraints}}):
  test_fused_topk_bias_nan_inf_clamp[dtype1-nan-sigmoid-4-8],
  test_fused_topk_bias_nan_inf_clamp[dtype2-nan-sigmoid-3-16],
  test_fused_topk_bias_nan_inf_clamp[dtype2-nan-sigmoid-4-6] all failed with
  "Row 1 has non-finite weights [nan, ...] (bad_value=nan, scoring_func=sigmoid)" --
  i.e. NaN input logits produce NaN output weights (not merely duplicate IDs), meaning
  whatever partial clamp exists on this path does not prevent non-finite weights from
  reaching the output for these particular shapes/dtypes. Notably,
  test_fused_topk_bias_nan_inf_clamp[dtype1-inf-sigmoid-3-16] and
  [dtype1-inf-sigmoid-4-16] PASSED in the same run -- confirming the bug is inconsistent
  across shapes/dtypes/bad_value kind (nan vs inf), consistent with different kernels
  (or different code paths within one kernel) being selected for different
  num_experts/topk/NUM_GRP combinations, only some of which hit the line-~1120 partial
  clamp or hit it in a way that is insufficient.
- Test reference (torch_topk in tests/kernels/moe/test_fused_topk.py) and the test
  bodies themselves (test_fused_topk_bias_nan_inf_clamp, ~lines 217-277) construct
  gating_output with row 0 normal and rows 1..3 fully poisoned with a single bad_value
  (nan or inf) broadcast across all experts in those rows, then assert finite weights
  and topk-unique-count-many unique expert IDs for the poisoned rows.'''

[vars.editable_mode_notes]
description = """\
How aiter distinguishes a true editable/develop install from a frozen wheel install, and \
what the investigator/experimenter/implementer must use to overwrite and verify it."""
default = '''aiter's setup.py decides packaging mode from argv: `is_develop_mode()`
(setup.py) is True when invoked as `python setup.py develop` or with any arg containing
"editable" (i.e. `pip install -e .`). `write_install_mode()` then writes a plain-text file
`<aiter-package-dir>/install_mode` containing literally `develop` or `install`.
For a REGULAR (non-develop) install, `prepare_packaging()` copies 3rdparty/, hsa/,
gradlib/, csrc/ into a separate `aiter_meta/` tree next to the installed package and
strips .gitignored asm dumps; develop mode skips this entirely (no aiter_meta copy is
made).
At import time, aiter/jit/core.py reads `{this_dir}/../install_mode`: if its content is
"develop", `AITER_META_DIR` is set to `AITER_ROOT_DIR` (the source tree itself, used
directly for JIT builds -- true editable mode); otherwise `AITER_META_DIR` is the
separate `aiter_meta/` copy. A missing install_mode file defaults to develop-mode
behavior.
To genuinely put the image's aiter into editable/develop mode against a tip-of-tree
checkout: get a tip-of-tree aiter source tree into the container (bind mount the rig
worktree, read-write -- aiter's JIT writes build artifacts back into its own source tree
at runtime, so a read-only mount silently breaks this), uninstall/remove the existing
non-editable amd-aiter wheel install (package dir, aiter_meta/, and its dist-info) from
site-packages, then run `python setup.py develop` (or `pip install -e .`, which
additionally needs `./.github/scripts/install_triton.sh` per aiter's CONTRIBUTE.md for
the full Python+HIP/CK kernel path) FROM the mounted worktree. Also clear BOTH JIT `.so`
cache locations before rebuilding, or a stale build silently persists across source
edits: `aiter/jit/build/<module>/build/<module>.so` AND the separate copy
aiter/jit/core.py actually imports from, `aiter/jit/<module>.so` (gitignored, directly
in the package dir) -- for this op that module is `module_moe_asm`. Verify genuine
editable mode by: (a) `python -c "import aiter; print(aiter.__file__)"` resolving inside
the mounted worktree, not dist-packages; (b) the worktree's own `aiter/install_mode`
file (not a copy) reading "develop"; (c) confirming no `aiter_meta/` tree was
created/used -- JIT builds must read source directly from the mounted worktree root.'''

[vars.gpu_rules]
description = "Rules for using the local GPUs safely."
default = '''LOCAL GPU RULES (this host has 8 MI300X GPUs, shared with other users).
1. Use ONE GPU per container. Before every launch run `rocm-smi --showuse` and
   `rocm-smi --showmeminfo vram`; pick a GPU with 0% use and ~no VRAM held.
   Never use a busy GPU. Record the index in your report. Importing aiter
   without real GPU access (no --device mapping) fails with "RuntimeError: No
   gfx arch found in rocminfo output" -- this is expected and not itself a bug;
   always run with real device access for anything beyond a plain syntax check.
2. Run containers with `--device=/dev/kfd --device=/dev/dri --group-add video
   --security-opt seccomp=unconfined --ipc=host --shm-size=16g` and
   `-e HIP_VISIBLE_DEVICES=<idx>`, name them with your claimed bead ID, use
   `--entrypoint bash` (the image entrypoint is not a shell), and `docker rm -f`
   them when done, on every error path.
3. aiter JIT-compiles kernels on first use and can take minutes; allow for it.
   Keep each experiment's JIT cache isolated (a per-bead cache directory) to
   avoid cross-experiment contamination.
4. Do not modify the image. Do not run `docker commit` over `{{image}}`. The
   editable-mode overwrite this task requires happens by bind-mounting a
   writable tip-of-tree aiter worktree into the container and running the
   install there, at container-run time; the underlying image is never
   altered. Mount the worktree READ-WRITE (never `:ro`): aiter's JIT writes
   generated build artifacts back into its own source tree, and a read-only
   mount silently breaks editable-mode JIT builds.
5. Disk: `/`, `/tmp`, `/root` share one overlay filesystem on this host (about
   3.5T total; check `df -h` before large builds).'''

[[steps]]
id = "body"
title = "Investigate, experiment, and fix aiter biased_grouped_topk's incomplete NaN/Inf clamp"
needs = ["implement"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "aiter-biased-grouped-topk-nan-clamp", "gc.scope_role" = "body" }

[[steps]]
id = "investigate"
title = "Investigate aiter biased_grouped_topk's NaN/Inf propagation into non-finite topk_weights"
needs = []
metadata = { "gc.run_target" = "aiter/investigation.investigator", "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description = """
Investigate the failure: on MI300 (gfx942), with VLLM_ROCM_USE_AITER=1 and
scoring_func="sigmoid", vLLM's `tests/kernels/moe/test_fused_topk.py::
test_fused_topk_bias_nan_inf_clamp[...]` fails for several (num_experts, topk,
dtype, bad_value) combinations because `rocm_aiter_ops.biased_grouped_topk`
(aiter's HIP kernel in csrc/kernels/topk_softmax_kernels_group.cu) propagates
NaN/Inf gating logits into non-finite topk_weights, instead of clamping them
the way vLLM's own native topk_softmax_kernels.cu does. This workflow requires
you to first overwrite the target image's installed aiter with a tip-of-tree
checkout in true editable/develop mode, and reproduce/diagnose the bug against
THAT editable install, not the image's stock wheel install.

Context, as unverified claims to confirm (not established facts):

{{known_context}}

Scope and exclusions: {{constraints}}

How aiter's editable/develop mode works, and how to put the image's aiter into
it against a tip-of-tree checkout (including the two separate JIT `.so` cache
locations that must both be cleared to force a genuine rebuild of
module_moe_asm):

{{editable_mode_notes}}

Environment: use the local docker image `{{image}}` (already present locally;
do not pull). Resolve the aiter rig's source repository and tip-of-tree commit
using `gc rig list --json` (registered path hint: {{repo_path}}); do not
assume this hint is accurate without verifying it against the rig
registration. Resolve the vllm rig/source the same way (registered path hint:
{{vllm_repo_path}}) for the test suite and dispatch-chain source
(fused_topk_bias_router.py, _aiter_ops.py) -- do not assume paths or line
numbers from {{known_context}} are current without re-checking them in the
resolved repo at its actual commit.

{{gpu_rules}}

Additional focus or hints: {{question}}

Diagnose only; follow your agent's isolation rules and do not implement a fix
in this step. Do the editable-mode overwrite in your own isolated worktree
(never the shared aiter checkout) at
`~/dev/cities/gc-worktrees/aiter/{{formula_id}}/investigate/<claimed-bead-id>`
on branch `{{formula_id}}/investigate/<claimed-bead-id>`, per your pack's
worktree protocol, and bind-mount that worktree read-write into the container
to perform the `setup.py develop` (or `pip install -e .`) overwrite and all
testing. Confirm genuine editable mode (aiter.__file__ location, install_mode
file content, absence of a used aiter_meta/ tree) before treating any
reproduction as valid.

Reproduce the smallest failing case first: a direct Python script that calls
`aiter.biased_grouped_topk` (or `rocm_aiter_ops.biased_grouped_topk`) on a
minimal gating_output tensor shaped like one of the failing test cases (e.g.
num_experts=8, topk=4, a NaN-poisoned row), before re-running the full
parametrized vLLM suite. For each failing (num_experts, topk, dtype,
bad_value) combination from {{known_context}}, determine empirically which of
the three __global__ kernels (topk_reg_kernel, grouped_topk_kernel,
grouped_topk_opt_sort_kernel) is actually dispatched -- by reading the
LAUNCHER_TOPK_REG/LAUNCHER2/LAUNCHER3/LAUNCHER4 macro chain in
csrc/kernels/topk_softmax_kernels_group.cu alongside the host-side
`biased_grouped_topk()` function's computation of `num_expert_group`,
`use_opt_sort`, and the register-path gate conditions for the ACTUAL shapes
used, not assumed ones -- and confirm by direct inspection (e.g. adding a
temporary printf/assert in your worktree, or stepping through with a debugger)
rather than static reasoning alone. For each dispatched kernel, trace exactly
where (if anywhere) a NaN or Inf input logit is clamped or allowed to survive
into `sig_scores`/`gating`/the final `topk_weights` write, and explain why the
PASSING cases (e.g. dtype1-inf-sigmoid-3-16, dtype1-inf-sigmoid-4-16 per
{{known_context}}) differ from the FAILING ones -- this contrast is likely the
fastest path to the precise defect. Separately, read
fused_topk_bias_router.py's fused_topk_bias() to confirm whether the
softmax+bias cluster noted in {{constraints}} is genuinely AITER-independent
(reproduces identically with VLLM_ROCM_USE_AITER=0) or shares a root cause
with the sigmoid+bias kernel bug; report this clearly either way without
necessarily fixing it, per {{constraints}}.

Use `{{artifact_dir}}` as the shared directory for this run. Write your
artifacts under `{{artifact_dir}}/investigate/`, creating that subdirectory if
needed; it must not contain an earlier run's reports. Do not overwrite
existing files.

Before closing this step, write `{{artifact_dir}}/investigate/investigation.md` with:
- Your claimed bead ID, the aiter and vllm tip-of-tree commits used, and date.
- The exact reproduction command, container name/flags, GPU index, environment
  variables, versions; mark missing information.
- The exact steps used to overwrite the image's aiter with the editable
  tip-of-tree checkout (worktree path/branch, mount flags, install command run
  inside the container, both JIT cache locations cleared, and the three
  editable-mode verification checks and their results).
- Fresh findings with file:line references (in the aiter and vllm worktrees)
  and raw output paths, including the empirically-confirmed kernel dispatch
  per failing shape and the exact point(s) where NaN/Inf survives. Separate
