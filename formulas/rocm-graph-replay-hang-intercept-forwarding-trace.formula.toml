protocol, and record each variant's commit SHA.

Follow your six-step protocol for every experiment: hypothesis, prediction (recorded before
running), exact command/environment, run, actual result, verdict (supports / contradicts /
inconclusive). Interleave arms in blocks with a fixed-seed order (record the seed and order) and
capture hang evidence per the rules. At minimum:
1. Fidelity. Repro on image A vs `...:a-rebuilt`, {{repro_trials_per_arm}} trials each,
