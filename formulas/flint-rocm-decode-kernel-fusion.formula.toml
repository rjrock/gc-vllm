  assume last session's single-capture percentages hold; if they diverge
  meaningfully, say so and use your fresh numbers.
- For decode attention: read `vllm/models/flint/ops/decode_attention.py`
  (`FlintDecodeAttention` / `flint_decode_attention`) as the STRUCTURAL reference
  for what gets fused and its exact numerics (split-KV paged decode attention, GQA,
  bf16 KV, HND page layout, attention sinks via
  `exp2(sink*log2e - m*c)` added to the denominator, sliding-window support) -- NOT
  as portable code (it is CuTe-DSL/SM100-only). Read
  `vllm/model_executor/layers/attention/attention.py`'s
  `unified_attention_with_output()` and whichever ROCm attention kernel(s) it
  currently dispatches to for this config (confirm which one -- there are multiple
  ROCm attention backend files under vllm/v1/attention/backends/). Determine
  whether a Triton-based fused decode-attention kernel (single-kernel split-KV
  paged attention matching FlintDecodeAttention's numerics) is tractable on
  gfx942/CDNA3, or whether aiter already exposes a comparable fused building block
  that could be called instead of writing one from scratch -- check for this before
  assuming a from-scratch kernel is required.
