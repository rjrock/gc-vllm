metadata = { "gc.kind" = "scope", "gc.scope_name" = "flint-rocm-decode-kernel-fusion", "gc.scope_role" = "body" }

[[steps]]
id = "investigate"
title = "Pin the exact ROCm decode-attention and QKV-fusion kernel boundaries and a Triton implementation plan"
needs = []
metadata = { "gc.run_target" = "vllm/investigation.investigator", "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
description = """
Read `{{prior_investigation_report}}`, `{{prior_experiment_report}}`, and
`{{prior_implementation_report}}` in full before doing anything else. All three are
from a prior, now fully-closed workflow (root bead vl-o2jh) on this exact model
(gfx942/MI300X) -- do not re-derive what they already established (the `_rsqrt()`
fix is confirmed correct and shipped at commit
d37904eddced37fd380c3e4187253a2342a8a1c6; do not re-test or revert it), and do not
duplicate their repro-building work; reuse their worktree lineage and fix commit
({{base_ref}}) as your starting point.

{{known_context}}

Environment: use docker image `{{image}}` on `{{node}}` (verify presence with `ssh
{{node}} docker image inspect {{image}}`). Resolve the vllm rig's source repository
using `gc rig list --json` (registered path hint: {{repo_path}}); confirm
`{{base_ref}}` still does NOT exist on the rig's default branch
(`git merge-base --is-ancestor d37904eddced37fd380c3e4187253a2342a8a1c6 main`) before
assuming you need it as a separate base, since this could have changed since
authoring time.

NODE={{node}} IMAGE={{image}} -- resolve every `<NODE>`/`<IMAGE>` placeholder in the
rules below to these values.

{{gpu_rules}}

Additional focus or hints: {{question}}

Diagnose and design only; do not implement a fix in this step. Concretely:

- Re-verify the kernel-time comparison in {{known_context}} point 3 is still
  representative: re-run (or confirm fresh results from) the alfred profiling
  harness (/home/ryrock/dev/alfred/recipes/nvidia/flint/amd-profile.sh) against
