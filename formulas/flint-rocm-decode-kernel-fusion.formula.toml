formula = "flint-rocm-decode-kernel-fusion"
version = 1
description = """\
Follow-up to flint-kv-cache-layout-fix (root bead vl-o2jh, fully closed, \
`gc.outcome=pass`/shipped): that workflow's own investigation redirected away from \
a suspected KV-cache physical-layout mismatch and instead pinned the real bug to \
`vllm/models/flint/ops/norm.py`'s `_rsqrt()` Triton helper -- a hardcoded PTX \
`rsqrt.approx.ftz.f32` inline-asm string that is CUDA-ISA-only and silently compiles \
to garbage on Triton's AMDGCN (ROCm) backend instead of raising. The shipped fix \
(commit d37904eddced37fd380c3e4187253a2342a8a1c6, branch \
flint-kv-cache-layout-fix/implement/vl-5wit, not yet on vllm main) gives `_rsqrt()` a \
`current_platform.is_cuda()` branch: CUDA keeps the original inline asm \
character-for-character, ROCm instead calls `tl.math.rsqrt()`. With that fix, Flint \
now serves real, sane chat completions end-to-end on ROCm/MI300X (gfx942) via vLLM's \
generic, backend-agnostic layers (`unified_attention_with_output`, stock \
`FusedMoEFactory`/aiter MoE) -- `_flint_kernels()` (vllm/models/flint/model.py) still \
unconditionally returns False whenever \
`not current_platform.is_device_capability_family(100)`, so none of Flint's hand-written \
fused CuTe-DSL (cutlass/cute/quack) decode kernels under vllm/models/flint/ops/ \
(`qkv_fused.py`, `decode_attention.py`, `nvfp4_gemv.py`, `linear.py`, `moe*.py`, all \
SM100/Blackwell-only) ever activate on ROCm.

This workflow's charter is the natural next step once correctness was established: \
Flint is now correct but slow on ROCm relative to its NVIDIA/SM100 fused-kernel path. \
A direct trace comparison (this formula's authoring session, profiler output at \
/home/ryrock/dev/alfred/recipes/nvidia/flint/{profile-shapes-prefill_10000,amd-profile-shapes-prefill_10000}/analysis/top_kernels-c1.yaml, \
same model, matched decode-heavy shapes) found two concrete, high-value fusion gaps \
where NVIDIA's decode step runs one fused CuTe-DSL kernel and ROCm instead runs \
several separate, unfused kernels:
1. Decode attention: NVIDIA's single fused `FlintDecodeAttention` kernel \
   (ops/decode_attention.py) is 8.3% of total kernel time in that capture; ROCm's \
   generic, unfused `kernel_unified_attention_2d`/`_3d` (reached via \
   `unified_attention_with_output`) together cost 21.0% (18.0% + 3.0%).
2. Small-M QKV dense projection + per-head norm/RoPE/cache-write: NVIDIA's \
   `qkv_fused` kernel (ops/qkv_fused.py, its norm sub-kernel and GEMV+RoPE+cache-write \
   sub-kernel together) is 15.3% (12.4% + 2.9%); ROCm instead runs a separate, unfused \
   `wvSplitK_hf_sml_<__hip_bfloat16,...>` GEMV plus the ALREADY-FUSED, ALREADY-PORTABLE \
   `_qk_norm_rope_cache_kernel` (ops/qk_norm_rope.py, plain Triton, confirmed running \
   correctly on ROCm today), together costing 24.1% (20.2% + 3.9%).

MoE routing was also compared (NVIDIA `_router_kernel` 6.4% vs. ROCm `topkGating` \
5.8%) and found to be roughly at parity already -- NOT a clear fusion win on the \
evidence gathered so far, so it is explicitly OUT of scope for this workflow; a future \
formula can revisit it with fresh evidence rather than this one guessing from a single \
capture.

CuTe-DSL (cutlass/cute/quack) is NVIDIA/SM100-only and not portable to ROCm as source; \
this workflow's technology direction is Triton, since it is PROVEN ALREADY WORKING on \
this exact hardware inside this exact file tree: `ops/qk_norm_rope.py`'s \
`_qk_norm_rope_cache_kernel` and `ops/norm.py`'s RMSNorm/SiLU kernels are plain Triton \
(no inline PTX asm, or PTX asm now correctly gated per the flint-kv-cache-layout-fix \
fix) and are confirmed present and correct in the ROCm profile capture above. New fused \
kernels for this workflow should follow that same shape: plain `@triton.jit`, backend- \
neutral or explicitly `current_platform.is_cuda()`-gated where a CUDA-only trick is \
used, mirroring the `_rsqrt()` precedent exactly rather than re-deriving a different \
pattern."""

[requires]
formula_compiler = ">=2.0.0"

[vars.artifact_dir]
description = "Absolute, shared artifact directory, unique to this workflow run."
required = true
pattern = "^/"

[vars.formula_id]
description = """\
Run identifier used to label this run's worktree directories and branches \
(<rig>/{{formula_id}}/<step>/<bead-id>). Defaults to this formula's name."""
default = "flint-rocm-decode-kernel-fusion"
pattern = "^[A-Za-z0-9_.-]+$"

[vars.node]
description = """\
Node to run repro/validation containers and `vllm serve` commands on, reached via \
plain `ssh {{node}} ...` (key-based, no interactive auth). Defaults to s79, the same \
MI300X (gfx942) host the two prior Flint ROCm workflows used, confirmed reachable with \
8 MI300X GPUs via `ssh s79 rocm-smi --showproductname` at those workflows' authoring \
time. Re-verify architecture (`ssh {{node}} rocm-smi --showproductname`) and GPU \
availability (`ssh {{node}} rocm-smi --showuse`) on whichever node is set here before \
trusting any result from it; do not assume either fact without checking, since node \
availability and contention change over time. If every GPU on `{{node}}` is busy, \
record that as a blocker rather than switching nodes without re-confirming architecture \
and artifact presence on the replacement."""
default = "s79"

[vars.image]
description = """\
Docker image to reproduce and validate in, on `{{node}}`. Verify it is present there \
with `ssh {{node}} docker image inspect {{image}}` before using it; do not pull. Built \
from {{base_ref}} (the flint-kv-cache-layout-fix fix), and the same image \
/home/ryrock/dev/alfred/recipes/nvidia/flint/amd.yaml already uses for profiling -- \
re-verify it still serves sane (non-garbage) chat completions before doing anything \
else, since this workflow's entire premise is a PERFORMANCE change on top of that \
already-correct behavior."""
default = "rjrock2/vllm:rocm-ci_base-nov02-flint-kv-cache-layout-fix-implement-vl-5wit"

[vars.repo_path]
description = """\
Host vllm checkout (registered as the vllm rig). Resolve the authoritative path via \
`gc rig list --json` rather than trusting this default blindly."""
default = "/home/ryrock/dev/vllm"
pattern = "^(/.*)?$"

[vars.model_path]
description = "Flint model weights path, on `{{node}}`."
default = "/data/models/flint"
pattern = "^(/.*)?$"

[vars.base_ref]
description = """\
Base ref for this workflow's worktrees. Unlike a typical formula, this is NOT empty/ \
tip-of-tree by default: vllm main does not yet contain the flint-kv-cache-layout-fix \
fix (confirmed at formula-authoring time via `git merge-base --is-ancestor \
d37904eddced37fd380c3e4187253a2342a8a1c6 main` on the vllm rig, which failed), so \
building on tip-of-tree main would silently lose the correctness fix this workflow \
depends on. Re-verify this is still true before trusting it -- if the fix has since \
merged to main, prefer tip-of-tree main instead and say so in your report."""
default = "flint-kv-cache-layout-fix/implement/vl-5wit"

[vars.question]
description = "Optional extra focus or hints."
default = ""

[vars.constraints]
description = """\
Scope this workflow to exactly the two fusion targets identified in {{known_context}}: \
(1) decode attention, (2) the small-M QKV dense projection + per-head norm/RoPE/ \
cache-write path. Do NOT attempt MoE router/gate fusion in this workflow -- the \
evidence gathered so far shows it at rough parity (NVIDIA 6.4% vs ROCm 5.8%), not a \
clear win; a future formula should re-evaluate it with its own fresh evidence rather \
than this workflow extending scope on a guess. Do not re-litigate or revert the \
flint-kv-cache-layout-fix fix (the `_rsqrt()` CUDA/ROCm branch in \
vllm/models/flint/ops/norm.py, or the earlier flint-rocm-attention-fix gating fix in \
`FlintAttention.__init__`, vllm/models/flint/model.py) -- both are confirmed correct \
and shipped; build on top of them in the same worktree lineage ({{base_ref}}), do not \
re-derive them.

Implement new kernels in Triton, following the `ops/qk_norm_rope.py` / `ops/norm.py` \
precedent exactly: plain `@triton.jit`, no inline PTX asm unless explicitly gated by \
`current_platform.is_cuda()` with a portable (e.g. `tl.math.*`) fallback for ROCm, \
mirroring the `_rsqrt()` fix's own shape. Any new fusion must be ADDITIVE: a new, \
ROCm-specific gating predicate (e.g. `_flint_kernels_rocm()` in \
vllm/models/flint/model.py, mirroring `_flint_kernels()`'s shape -- \
`current_platform.is_rocm()`, an appropriate arch-family check for gfx942/gfx950, and \
the same TP=1/no-EP/no-EPLB constraints `_flint_kernels()` already enforces) that \
activates the new ROCm kernels, living ALONGSIDE the existing SM100 gate. Do not modify \
`_flint_kernels()` itself, any CUDA/cutlass/cute/quack file under ops/, or any existing \
CUDA-path behavior or test (tests/models/flint/test_flint_ops.py, \
test_decode_attention.py, test_qk_norm_rope.py, test_qkv_fused.py, test_flint_moe.py, \
test_gguf_nvfp4.py) -- these must remain exactly unchanged for CUDA; they are expected \
to skip (not fail) on `{{node}}`'s ROCm hardware per their existing \
`current_platform.is_cuda()` skip guards, same pattern as test_decode_attention.py's \
own `pytest.skip(..., allow_module_level=True)`. Add new, ROCm-parametrized test \
file(s) under tests/models/flint/ alongside (not replacing) the existing ones, using an \
analogous skip-on-non-ROCm guard.

This is a PERFORMANCE workflow, not a correctness workflow -- but correctness is still \
the primary gate: any new fused kernel must reproduce the exact numerics of what it \
replaces (RMSNorm/RoPE formulas as documented in ops/qk_norm_rope.py's own docstring; \
attention sinks/sliding-window semantics as currently implemented by \
`unified_attention_with_output`), validated with real `vllm serve` + real chat \
completions, not just a kernel-level unit match. A measurable decode-step speedup \
(before/after kernel-time share and wall-clock decode latency) is a required SECOND \
gate, not optional -- reuse /home/ryrock/dev/alfred/recipes/nvidia/flint/ (`amd.yaml`, \
`amd-profile.sh`, `server.yaml`) as the known-good profiling harness for this, since it \
already produces exactly the `top_kernels.yaml`/trace artifacts cited in \
{{known_context}}; do not invent a different profiling method without saying why the \
existing harness did not work. Do not run `pip install`/`pip uninstall` against vllm \
inside any container in this workflow, for any reason -- see {{editable_mode_notes}}."""

[vars.known_context]
description = """\
What is already established from the two prior, fully-closed Flint ROCm workflows -- \
evidence to build on, not a conclusion to copy blindly. Re-verify anything load-bearing \
before relying on it."""
default = '''1. CONFIRMED, CLOSED WORKFLOW #1: flint-rocm-attention-fix (root vl-apjh)
fixed Flint's construction-time crash on ROCm/gfx942 by gating the unconditional
FlashInfer import/assert in `FlintAttention.__init__` (vllm/models/flint/model.py),
falling back to vLLM's generic `unified_attention_with_output()` path when no
FlashInfer impl is in use. Fully closed; do not re-test or revert this.

2. CONFIRMED, CLOSED WORKFLOW #2: flint-kv-cache-layout-fix (root vl-o2jh, reports
at {{prior_investigation_report}}, {{prior_experiment_report}},
{{prior_implementation_report}}) investigated the resulting degenerate-chat-completion
symptom, redirected (via direct instrumentation, not assumption) from a suspected
KV-cache physical-layout mismatch to the real cause: `_rsqrt()` in
vllm/models/flint/ops/norm.py hardcoded CUDA-only PTX inline asm
(`rsqrt.approx.ftz.f32`), which Triton's ROCm/AMDGCN backend does not reject but
silently miscompiles. Shipped fix (commit
d37904eddced37fd380c3e4187253a2342a8a1c6, branch
flint-kv-cache-layout-fix/implement/vl-5wit): `_rsqrt()` branches on
`current_platform.is_cuda()`, keeping the exact original inline asm for CUDA and
calling `tl.math.rsqrt()` for everything else. Validated end-to-end on MI300X/gfx942
via real `vllm serve` + real chat-completion HTTP requests (image
rjrock2/vllm-ci-ext:oct28 at validation time; this workflow's {{image}} default is the
subsequently-built image from this exact fix commit).

3. CONFIRMED BY REAL TRACE EVIDENCE (this formula's own authoring session, NOT part
of either prior workflow): with the above fix applied, Flint serves correct output on
ROCm but with a slower decode step than its NVIDIA/SM100 fused-kernel path. Matched
decode-heavy profiling captures (same model, same shapes, profiler output at
/home/ryrock/dev/alfred/recipes/nvidia/flint/profile-shapes-prefill_10000/analysis/top_kernels-c1.yaml
for NVIDIA and
/home/ryrock/dev/alfred/recipes/nvidia/flint/amd-profile-shapes-prefill_10000/analysis/top_kernels-c1.yaml
for ROCm) show:
   - Decode attention: NVIDIA's fused `FlintDecodeAttention` kernel
     (vllm/models/flint/ops/decode_attention.py) is 8.3% of total kernel time; ROCm's
     unfused `kernel_unified_attention_2d` + `kernel_unified_attention_3d` (reached via
     `unified_attention_with_output`, vllm/model_executor/layers/attention/attention.py)
     together cost 21.0% (18.0% + 3.0%).
   - Small-M QKV dense projection + per-head norm/RoPE/cache-write: NVIDIA's
     `qkv_fused` kernel and its norm sub-kernel (vllm/models/flint/ops/qkv_fused.py)
     together are 15.3% (12.4% + 2.9%); ROCm instead runs a separate, unfused
     `wvSplitK_hf_sml_<__hip_bfloat16,...>` GEMV (the generic dense-linear path) plus
     the ALREADY-FUSED, ALREADY-PORTABLE `_qk_norm_rope_cache_kernel`
     (vllm/models/flint/ops/qk_norm_rope.py, plain Triton -- confirmed running
     correctly on ROCm today), together costing 24.1% (20.2% + 3.9%).
   - MoE routing is roughly at parity (NVIDIA `_router_kernel` 6.4% vs ROCm
     `topkGating` 5.8%) -- NOT a confirmed fusion win; explicitly out of scope per
     {{constraints}}.
These percentages are single-capture estimates from one profiling run each, not a
statistically robust benchmark -- re-measure fresh with the same harness
(/home/ryrock/dev/alfred/recipes/nvidia/flint/amd-profile.sh) before and after any
candidate fix, rather than trusting these specific numbers as ground truth.

4. THE FUSION-TECHNOLOGY CONSTRAINT: NVIDIA's fused kernels
(ops/qkv_fused.py, ops/decode_attention.py, ops/nvfp4_gemv.py, ops/linear.py,
ops/moe*.py) are all written in CuTe-DSL (`import cutlass`, `cutlass.cute`,
`quack.compile_utils`), gated behind `_flint_kernels()`'s
`current_platform.is_device_capability_family(100)` check -- genuinely SM100/
Blackwell-only, not portable to ROCm as source, and NOT this workflow's starting
point for implementation (do not attempt to compile or adapt CuTe-DSL for ROCm).
The viable technology, PROVEN ALREADY WORKING on this exact hardware in this exact
file tree, is Triton: ops/qk_norm_rope.py's `_qk_norm_rope_cache_kernel` (fused
per-head q/k RMSNorm + NeoX RoPE + paged KV-cache write) and ops/norm.py's RMSNorm/
SiLU kernels are plain `@triton.jit` functions, confirmed present and correct in the
ROCm profile capture in point 3 above. Use `qk_norm_rope_cache()`'s own docstring
(numerics: "RMSNorm computes bf16(x * rsqrt(mean(x^2) + eps) * w) in fp32, RoPE
computes x * cos - y * sin in fp32 from the fp32 cos/sin cache ... and rounds to
bf16") as the authoritative reference for what any new fused kernel must numerically
reproduce.

5. NOT YET CHECKED by either prior workflow or this formula's authoring session:
the precise Triton kernel-fusion boundary for ROCm decode attention (e.g. whether a
single fused kernel analogous to FlintDecodeAttention's split-KV paged-attention
shape is feasible in Triton on CDNA3/gfx942, or whether a narrower fusion -- e.g.
folding the sliding-window/sink logic into fewer kernel launches without a full
from-scratch attention kernel -- is more tractable); the exact small-M threshold
and dispatch shape for a Triton QKV GEMV fast path analogous to ops/linear.py's
`_use_gemv()` dispatch; whether aiter (the AMD kernel library already used elsewhere
in this vllm fork for MoE) exposes any usable building block for either target
instead of a from-scratch Triton kernel. All of this is the investigation step's job
to pin down, not an assumption for implementation to start from.'''

