  reasoning for why it is expected to reduce kernel-launch/dispatch overhead
  relative to the current unfused path.
- The exact new gating predicate and dispatch wiring shape.
- The new test coverage plan.
- A minimal experiment plan for the experimenter: hypothesis, prediction, exact
  commands (including the alfred profiling harness invocation for before/after
  comparison), distinguishing result (both correctness AND measured speedup).

Append the handoff summary and absolute report path to this claimed step's notes
with `gc bd update <claimed-bead-id> --append-notes <text>` and record
`--set-metadata investigation.report_path=<path>`. Verify the report is readable,
then set `gc.outcome=pass` on this claimed step and close only it.

If blocked (image missing, no idle GPU reachable, cannot produce a usable handoff),
append the reason, set `gc.outcome=fail` and `gc.failure_reason=<reason>`, and close
only this step. Do not close the workflow root.
