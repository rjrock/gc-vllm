  (`flint_qkv_fused`) as the STRUCTURAL reference (residual-add RMSNorm fused with
  QKV GEMV + per-head q/k RMSNorm + RoPE + paged KV-cache write, for decode batches
  `M <= MAX_M`), and `vllm/models/flint/ops/qk_norm_rope.py`
  (`qk_norm_rope_cache`/`_qk_norm_rope_cache_kernel`) and `vllm/models/flint/ops/
  norm.py` as the TECHNOLOGY reference (plain Triton, already correct on ROCm).
  Determine the exact additional fusion boundary needed (folding the dense QKV GEMV
  itself into the existing Triton `_qk_norm_rope_cache_kernel`, or a new preceding
  Triton GEMV kernel feeding it) and the small-M dispatch threshold analogous to
  `ops/linear.py`'s `_use_gemv()`/`pick_nt()` dispatch tables, tuned for CDNA3's
  own GEMV characteristics (do not assume NVIDIA's MAX_M=8 or tuned-table shapes
  transfer directly).
- Specify the exact new ROCm gating predicate shape (e.g. `_flint_kernels_rocm()`
  in vllm/models/flint/model.py, mirroring `_flint_kernels()`'s
  `current_platform.is_device_capability_family(100)` check with an analogous
  `current_platform.is_rocm()` + gfx942/gfx950 arch check, and the same TP=1/
  no-EP/no-EPLB constraints) and exactly where in `FlintAttention`/`FlintModel`'s
  forward path the new kernels would be dispatched from, additively, without
  touching the existing SM100 branch.
- Identify what precise test coverage (tests/models/flint/) the implement step
  should add: new ROCm-parametrized test file(s) analogous to
  test_decode_attention.py/test_qkv_fused.py, using a `current_platform.is_rocm()`
  (or equivalent) skip guard mirroring their existing `is_cuda()`-gated
  `pytest.skip(..., allow_module_level=True)` pattern.

Use `{{artifact_dir}}` as the shared directory for this run. Write your artifacts
under `{{artifact_dir}}/investigate/`, creating that subdirectory if needed; it must
not contain an earlier run's reports. Do not overwrite existing files.

Before closing this step, write `{{artifact_dir}}/investigate/investigation.md`
with:
