Save experiment records and raw output under `{{artifact_dir}}/experiment/` (creating it if
needed) and write `{{artifact_dir}}/experiment/experiments.md` with the producer bead ID, every
experiment's six steps, evidence paths, verdicts, uncertainties, and a recommended fix
direction naming the exact vllm source file(s)/function(s), the change, and the tested
revision -- or, if the hypothesis is refuted, a clear statement of why a vllm-only fix is not
viable. Do not implement the production fix in the shared vllm checkout; candidate edits
