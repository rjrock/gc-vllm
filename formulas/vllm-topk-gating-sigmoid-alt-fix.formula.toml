  pass/fail counts, comparing directly to the baseline run above.
- Check whether `_aiter_topk_gating_supported()`'s existing shape/dtype gate actually accepts
  every sigmoid test parametrization, or silently falls through to the old `topk_sigmoid` path
  (or vLLM's native kernel) for some cases -- if some cases fall through, report exactly which
