description = """
Read `{{artifact_dir}}/investigate/investigation.md` before running anything. Read the
producer bead ID recorded in it, and verify it belongs to the same `gc.root_bead_id` as your
claimed step and has `gc.outcome=pass`. Test environment: docker image `{{image}}`.

Scope and exclusions: {{constraints}}

IMAGE={{image}} -- resolve `<IMAGE>` in the rules below to this value.

{{gpu_rules}}

Additional focus or hints: {{question}}

Use a worktree at `~/dev/cities/gc-worktrees/vllm/{{formula_id}}/experiment/<claimed-bead-id>`
on branch `{{formula_id}}/experiment/<claimed-bead-id>`, per your pack's worktree protocol.
Do not create or edit an aiter worktree; {{aiter_repo_path}} is read-only reference only.

Test the handoff's hypotheses; do not assume its conclusions are correct, including whether a
vllm-only fix is genuinely viable -- re-derive the dispatch change yourself and confirm it
